<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COPE-TEX - Connexion</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system,'Segoe UI',Arial,sans-serif; }
  body { background: linear-gradient(135deg,#1e3a8a,#3b82f6); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .box { background:white; border-radius:20px; padding:40px 30px; max-width:400px; width:100%; box-shadow:0 20px 60px rgba(0,0,0,0.3); text-align:center; }
  .logo { font-size:32px; font-weight:800; color:#1e3a8a; letter-spacing:2px; margin-bottom:5px; }
  .sub { font-size:13px; color:#6b7280; margin-bottom:30px; }
  label { display:block; text-align:left; font-size:13px; font-weight:600; color:#4b5563; margin-bottom:8px; }
  input { width:100%; padding:15px; border:2px solid #e5e7eb; border-radius:10px; font-size:16px; text-align:center; letter-spacing:3px; font-weight:700; text-transform:uppercase; }
  input:focus { outline:none; border-color:#1e3a8a; }
  button { width:100%; padding:15px; background:#1e3a8a; color:white; border:none; border-radius:10px; font-size:16px; font-weight:700; margin-top:15px; cursor:pointer; }
  button:hover { background:#152c66; }
  .error { background:#fef2f2; color:#991b1b; padding:10px; border-radius:8px; font-size:13px; margin-top:15px; }
  .hint { font-size:12px; color:#9ca3af; margin-top:20px; }
</style>
</head>
<body>
<div class="box">
  <div class="logo">COPE-TEX</div>
  <div class="sub">Suivi de production</div>
  <form method="POST">
    <label>Votre code d'accès</label>
    <input type="text" name="code" placeholder="••••" autofocus required>
    <button type="submit">Entrer</button>
  </form>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <div class="hint">Code chef par défaut : CHEF</div>
</div>
</body>
</html>
